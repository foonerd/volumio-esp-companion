[workspace]
resolver = "2"
members = [
    "art",
    "core",
    "drivers/ch32v003-expander",
    "drivers/cst3530",
    "drivers/es8311",
    "drivers/es9018k2m",
    "hal",
    "runtime",
    "sim",
]
# Each firmware crate is a workspace of its own: an ESP-IDF target, its own
# toolchain channel and its own sdkconfig. Built from its directory. The
# ESP-IDF platform and board crates build only inside one of them.
exclude = [
    "boards/waveshare-esp32-c5-touch-lcd-28",
    "firmware/waveshare-esp32-c5-touch-lcd-28",
    "platform/esp-idf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/foonerd/volumio-esp-companion"
publish = false

# One set of lints for every crate; check.sh denies warnings.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
