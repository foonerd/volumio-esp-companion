[package]
name = "companion-sim"
description = "Volumio ESP Companion: the application on a desktop window or in a PNG, talking to a real player, for page work without a board"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["window"]
# The SDL2 window. Needs libsdl2-dev at build time; without the feature the
# simulator still renders to a PNG with --snapshot.
window = ["embedded-graphics-simulator/with-sdl"]

[dependencies]
companion-art = { path = "../art" }
companion-core = { path = "../core" }
companion-hal = { path = "../hal" }
companion-runtime = { path = "../runtime" }
embedded-graphics = "0.8"
embedded-graphics-simulator = { version = "0.8", default-features = false }
env_logger = "0.11"
gethostname = "1"
if-addrs = "0.15"
log = "0.4"
ureq = "3"
