[package]
name = "cst3530"
description = "Volumio ESP Companion: driver for the Hynitron CST3530 capacitive touch controller, as Waveshare's ESP32 touch panels use it, over embedded-hal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
companion-hal = { path = "../../hal" }
embedded-hal = "1"

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }
